<!-- Campos para digitar dois textos

Botão “Comparar”

Área para mostrar o resultado -->

<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Similaridade Textual</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Comparação de Textos</h1>
      <p class="descricao">
        A análise de similaridade textual utiliza técnicas de processamento de
        linguagem natural.
      </p>

      <div class="textareas">
        <textarea id="texto1" placeholder="Digite o primeiro texto"></textarea>
        <textarea id="texto2" placeholder="Digite o segundo texto"></textarea>
      </div>

      <button onclick="compararTextos()">Comparar</button>

      <div id="resultado" class="resultado"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
